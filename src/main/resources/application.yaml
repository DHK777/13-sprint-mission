spring:
  application:
    name: discodeit
  profiles:
    active: dev
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
logging:
  level:
    root: info
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
discodeit:
  storage:
    type: local
    local:
      root-path: ./uploads
management:
  endpoints:
    web:
      exposure:
        include: "health,info,metrics,loggers"
  info:
    env:
      enabled: true

info:
  app:
    name: "Discodeit"
    version: "0.0.1-SNAPSHOT"
  java:
    version: "17"
  spring:
    boot:
      version: "3.5.14"
  config:
    datasource:
      url: "${spring.datasource.url}"
      driver-class-name: "${spring.datasource.driver-class-name}"
    jpa:
      ddl-auto: "${spring.jpa.hibernate.ddl-auto}"
    storage:
      type: "${discodeit.storage.type}"
      path: "${discodeit.storage.local.root-path}"
    multipart:
      max-file-size: "${spring.servlet.multipart.max-file-size}"
      max-request-size: "${spring.servlet.multipart.max-request-size}"