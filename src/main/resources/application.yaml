spring:
  application:
    name: discodeit
  profiles:
    active: dev
  sql:
    init:
      mode: always
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
logging:
  level:
    root: info
    org.hibernate.SQL: DEBUG
    org.hibernate.orm.jdbc.bind: TRACE
discodeit:
  storage:
    type: local
    local:
      root-path: ./uploads